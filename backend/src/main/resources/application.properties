spring.application.name=OnlineCertificateManagementSystem
server.port=${PORT:5000}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/certificate?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.jwt.secret=${APP_JWT_SECRET:change-me-dev-secret}
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
